name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Invariant tests
        run: pytest -q tests
      - name: Benchmarks (speed / thin-structure / bottom-crop control)
        run: python tools/benchmark.py --size 64 --colors 16 --crop-control
      - name: Edge parameter matrix
        run: python tools/edge_bench.py --sizes 64 --colors 16
      - name: CLI smoke test (single file + batch)
        run: |
          python pxconv.py assets/sample_raw.png -o /tmp/one.png --size 64 --colors 16
          mkdir -p /tmp/in && cp assets/sample_raw.png /tmp/in/
          python pxconv.py /tmp/in -o /tmp/out --size 48 --colors 8
          python -c "import sys; from PIL import Image; im=Image.open('/tmp/out/sample_raw.png'); print('batch out', im.size, im.mode)"
